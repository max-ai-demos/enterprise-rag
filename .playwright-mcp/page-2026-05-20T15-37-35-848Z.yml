                    - generic: "M ONETARY POLICY FEEDBACK RULE (T AYLOR RULE ) i t , t +1 = r ∗ t , t +1 + π ∗ t , t +1 + φ Y ( Y t − Y ∗ t ) + φ π ( π t , t +1 − π ∗ t , t +1 ) . Y ∗ t : Fed’s target for output; π ∗ t , t +1 : Fed’s target for inflation (2%); r ∗ t , t +1 : real interest rate when Y t = Y ∗ t and π t , t +1 = π ∗ t , t +1 . φ Y > 0: when output is below target, Fed lowers interest rates. φ π > 0: when inflation is above target, Fed raises interest rates. Assumption: φ Y , φ π large enough, and inflation sluggish enough, that Fed raises real interest rate. This is usually true. 13 / 25"
