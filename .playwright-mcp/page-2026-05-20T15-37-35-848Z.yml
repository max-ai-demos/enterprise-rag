                - generic [ref=e321]: "M ONETARY POLICY AND LONG - TERM INTEREST RATES Fed controls short-term nominal rate. What about longer term rates? Definition: a pure discount nominal bond is a promise to pay a fixed sum (the face value) at a date in the future. Example: once every four weeks the U.S. Treasury issues a new 52 week Treasury bill which promises to pay $ 100 in exactly 52 weeks. Example: most Mondays the Treasury issues a new 13 week bill. What is the relationship between the prices of 13 and 52 week bill? 19 / 25"
                - generic [ref=e325]: "M ONETARY POLICY AND LONG - TERM INTEREST RATES Fed controls short-term nominal rate. What about longer term rates? Definition: a pure discount nominal bond is a promise to pay a fixed sum (the face value) at a date in the future. Example: once every four weeks the U.S. Treasury issues a new 52 week Treasury bill which promises to pay $ 100 in exactly 52 weeks. For Immediate Release CONTACT: Treasury Auctions January 23, 2024 202-504-3550 TREASURY AUCTION RESULTS Term and Type of Security 364-Day Bill CUSIP Number 912797JR9 High Rate 1 4.570% Allotted at High 99.43% Price 95.379222 Investment Rate 2 4.814% Median Rate 3 4.540% Low Rate 4 4.480% Issue Date January 25, 2024 Maturity Date January 23, 2025 Tendered Accepted Competitive $138,542,335,000 $44,335,255,000 Example: most Mondays the Treasury issues a new 13 week bill. What is the relationship between the prices of 13 and 52 week bill? 19 / 25"
                - generic [ref=e329]: "B OND PRICES AND INTEREST RATES Suppose you pay P 52 t for 52 week Treasury bill. Compute return to holding bond: R t , t +52 = 100 P 52 t . Define nominal interest rate as i t , t +52 = R t , t +52 − 1. Approximation if P 52 t ≈ 100 : i t , t +52 = 100 − P 52 t P 52 t = 100 − P 52 t 100 100 P 52 t ≈ 100 − P 52 t 100 = 1 − . 01 P 52 t . Example: bond costs $ 99, interest rate is 100 / 99 − 1 = 0 . 010101 ... . Example: bond costs $ 98, interest rate is 100 / 98 − 1 = 0 . 020408 ... . Result: bond prices move inversely with interest rates. 20 / 25"
                - generic [ref=e333]: "T ERM STRUCTURE What is return on a 52 week Treasury bill? Consider alternative investment: buy 13 week bill and obtain return R t , t +13 , in 13 weeks invest proceeds in another 13 week bill, in another 13 weeks invest proceeds in another 13 week bill... Expected return: t + 13 : R t , t +13 t + 26 : E t [ R t , t +13 R t +13 , t +26 ] t + 39 : E t [ R t , t +13 R t +13 , t +26 R t +26 , t +39 ] t + 52 : E t [ R t , t +13 R t +13 , t +26 R t +26 , t +39 R t +39 , t +52 ] . This strategy is risky, because future interest rates are uncertain. Risk neutrality means indifferent between this strategy and investing directly in 52 week bill: R t , t +52 = E t [ R t , t +13 R t +13 , t +26 R t +26 , t +39 R t +39 , t +52 ] . 21 / 25"
                - generic [ref=e337]: "E XPECTATIONS HYPOTHESIS OF TERM STRUCTURE Useful fact: if x , y are small, then (1 + x )(1 + y ) ≈ 1 + x + y . Using R t , t + j = 1 + i t , t + j and the above fact: i t , t +52 ≈ E t [ i t , t +13 + i t +13 , t +26 + i t +26 , t +39 + i t +39 , t +52 ] . This is the expectations hypothesis of the term structure. It states that a long-term interest rate is equal to the sum of expected short term interest rates over the contract horizon. Corollary: if the Fed can control short term interest rates, it can also affect long term interest rates through expectations of future short term interest rates. 22 / 25"
