                - generic [ref=e305]: "M ONETARY POLICY OPERATION The central bank (Federal Reserve, or “Fed”) sets i t . How? Fed pays overnight interest on reserves to banks i ior t . No bank will lend at a rate below i ior t because Fed is safest counterparty. Fed borrows from non-banks at rate i rrp t (reverse repo). No non-bank will lend at a rate below i rrp t because Fed is safest counterparty. Ample reserves: banks hold excess reserves, ensuring i ior t is marginal safe lending rate. 18 / 25"
                - generic [ref=e308]:
                  - generic [ref=e309]: O UTLINE 1 M ONEY 2 R EAL AND NOMINAL INTEREST RATE 3 M ONETARY POLICY 4 T ERM STRUCTURE OF INTEREST RATES
