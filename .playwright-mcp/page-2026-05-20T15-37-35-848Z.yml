                    - generic: "F EDERAL R ESERVE DUAL MANDATE Federal Reserve Act as amended in 1977: “The Board of Governors of the Federal Reserve System and the Federal Open Market Committee shall maintain long run growth of the monetary and credit aggregates commensurate with the economy’s long run potential to increase production, so as to promote effectively the goals of maximum employment, stable prices and moderate long-term interest rates.” In practice, moderate long-term interest rates seen as bi-product of stable prices and maximum employment. 11 / 25"
                - generic [ref=e221]:
                  - generic:
                    - generic: "D UAL MANDATE IN PRACTICE : INFLATION TARGETING Since 2012, Federal Reserve has practiced “inflation targeting.” Statement of longer run goals: The inflation rate over the longer run is primarily determined by monetary policy, and hence the Committee has the ability to specify a longer-run goal for inflation. The Committee reaffirms its judgment that inflation at the rate of 2 percent, as measured by the annual change in the price index for personal consumption expenditures, is most consistent over the longer run with the Federal Reserve’s statutory mandate... In order to anchor longer-term inflation expectations at this level, the Committee seeks to achieve inflation that averages 2 percent over time... Monetary policy actions tend to influence economic activity, employment, and prices with a lag. In setting monetary policy, the Committee seeks over time to mitigate shortfalls of employment from the Committee’s assessment of its maximum level and deviations of inflation from its longer-run goal... Moreover, sustainably achieving maximum employment and price stability depends on a stable financial system. 12 / 25"
                - generic [ref=e223]:
