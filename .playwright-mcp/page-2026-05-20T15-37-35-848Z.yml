            - paragraph [ref=e256]: What is monetary policy and how does the central bank control interest rates?
            - generic [ref=e258]:
              - paragraph [ref=e265]: Monetary policy refers to the process by which a central bank, such as the Federal Reserve, manages the supply of money and interest rates in an economy. The central bank uses various tools to influence economic activity, primarily by controlling nominal interest rates. By adjusting these rates, the central bank can influence inflation and employment levels. For instance, lowering interest rates can stimulate economic activity by making borrowing cheaper, while raising rates can help control inflation by making borrowing more expensive. [来源1]
