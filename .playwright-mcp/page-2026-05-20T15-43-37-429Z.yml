            - paragraph [ref=e358]: What is the difference between real and nominal interest rates?
            - generic [ref=e360]:
              - paragraph [ref=e367]: The difference between real and nominal interest rates lies in the adjustment for inflation. The nominal interest rate is the stated rate without any adjustments for inflation. In contrast, the real interest rate is the nominal rate adjusted for the effects of inflation, reflecting the true cost of borrowing and the true yield on savings. The real interest rate provides a more accurate measure of the purchasing power of interest earnings or payments. [来源2][来源3][来源4][来源5]
